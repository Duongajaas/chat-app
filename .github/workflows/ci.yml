name: Build and regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: ci-only-password }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CHATAPP_TEST_REDIS: localhost:6379,connectTimeout=2000,asyncTimeout=2000,syncTimeout=2000
      CHATAPP_TEST_POSTGRES: Host=localhost;Database=postgres;Username=postgres;Password=ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet test ChatApp.Tests/ChatApp.Tests.csproj --configuration Release
      - run: dotnet tool install dotnet-ef --version 10.0.4 --tool-path /tmp/ef
      - run: /tmp/ef/dotnet-ef migrations has-pending-model-changes --project ChatApp/ChatApp.csproj
      - run: docker build -t chatapp-api:ci ChatApp
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: chat-app-web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: chat-app-web/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: docker build -t chatapp-web:ci .
